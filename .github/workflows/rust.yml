name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: esp32c6_latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      env:
          ENV: development
      ports:
        - 80
        - 443
      

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
